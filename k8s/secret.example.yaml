# Template only — never commit real values here. Copy to secret.yaml (gitignored), fill in real
# values, and `kubectl apply -f k8s/secret.yaml`. Generate API_KEY/CLUSTER_SECRET with: uuidgen
apiVersion: v1
kind: Secret
metadata:
  name: bxthreads-secrets
type: Opaque
stringData:
  DB_PASSWORD: "REPLACE_ME"
  API_KEY: "REPLACE_ME"
  # Shared secret the /__cluster relay checks between pods (boxlang-express's ClusterManager.bx).
  # Blank disables the check — fine only because pod-to-pod traffic never leaves the cluster
  # network; don't leave it blank if that assumption stops being true.
  CLUSTER_SECRET: "REPLACE_ME"
