<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background: BoxLang near-black -->
  <rect width="1200" height="630" fill="#0e0f1a"/>

  <!-- Subtle grid/texture lines for visual interest -->
  <defs>
    <linearGradient id="accent-diagonal" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#00dbff"/>
      <stop offset="100%" stop-color="#00ff78"/>
    </linearGradient>
    <linearGradient id="fade-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ff78" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00ff78" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade-bottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00dbff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00dbff" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <!-- Top accent bar -->
  <rect width="1200" height="4" fill="url(#accent-diagonal)"/>

  <!-- Subtle gradient overlays -->
  <rect width="1200" height="200" fill="url(#fade-top)"/>
  <rect y="430" width="1200" height="200" fill="url(#fade-bottom)"/>

  <!-- Corner accent marks -->
  <line x1="40" y1="40" x2="100" y2="40" stroke="#00dbff" stroke-width="2" opacity="0.35"/>
  <line x1="40" y1="40" x2="40" y2="100" stroke="#00dbff" stroke-width="2" opacity="0.35"/>
  <line x1="1100" y1="40" x2="1160" y2="40" stroke="#00ff78" stroke-width="2" opacity="0.35"/>
  <line x1="1160" y1="40" x2="1160" y2="100" stroke="#00ff78" stroke-width="2" opacity="0.35"/>
  <line x1="40" y1="530" x2="40" y2="590" stroke="#00dbff" stroke-width="2" opacity="0.35"/>
  <line x1="40" y1="590" x2="100" y2="590" stroke="#00dbff" stroke-width="2" opacity="0.35"/>
  <line x1="1160" y1="530" x2="1160" y2="590" stroke="#00ff78" stroke-width="2" opacity="0.35"/>
  <line x1="1100" y1="590" x2="1160" y2="590" stroke="#00ff78" stroke-width="2" opacity="0.35"/>

  <!-- Main logo: [ bx ] -->
  <text x="600" y="295" font-family="Poppins, Arial, Helvetica, sans-serif" font-size="120" font-weight="bold" text-anchor="middle" dominant-baseline="central">
    <tspan fill="#00dbff">[</tspan><tspan fill="#00ff78" dx="8"> bx </tspan><tspan fill="#00dbff" dx="8">]</tspan>
  </text>

  <!-- Tagline -->
  <text x="600" y="390" font-family="Poppins, Arial, Helvetica, sans-serif" font-size="28" fill="#8fa89a" text-anchor="middle" letter-spacing="6">
    BXTHREADS
  </text>

  <!-- Bottom accent bar -->
  <rect y="626" width="1200" height="4" fill="url(#accent-diagonal)"/>
</svg>
